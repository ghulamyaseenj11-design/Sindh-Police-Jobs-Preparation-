<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Sindh Jail Police</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">SJP</span>
        <span><strong>Sindh Jail Police</strong><small>Admin Panel</small></span>
      </a>
      <a class="nav-home" href="index.html">← Back to Website</a>
    </div>
  </header>

  <main class="admin-main container">
    <section class="admin-card" id="loginSection">
      <span class="eyebrow">SECURE ACCESS</span>
      <h1>Admin Login</h1>
      <p class="muted">Sign in using your authorized administrator account.</p>
      <form id="loginForm">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="Enter admin email" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" required>
        <button class="btn btn-gold btn-full" type="submit">Login</button>
      </form>
      <p id="loginMessage" class="form-message" aria-live="polite"></p>
    </section>

    <section class="dashboard hidden" id="dashboardSection">
      <div class="dashboard-heading">
        <div>
          <span class="eyebrow">CONTROL CENTRE</span>
          <h1>Admin Dashboard</h1>
          <p class="muted">Manage website announcements.</p>
        </div>
        <button class="btn btn-outline-dark" id="logoutButton" type="button">Logout</button>
      </div>

      <div class="admin-card">
        <h2>Publish Announcement</h2>
        <form id="announcementForm">
          <label for="announcementTitle">Announcement Title</label>
          <input id="announcementTitle" type="text" maxlength="150" placeholder="Enter announcement title" required>
          <label for="announcementContent">Announcement Details</label>
          <textarea id="announcementContent" rows="5" placeholder="Write announcement details..." required></textarea>
          <button class="btn btn-gold" type="submit">Publish Announcement</button>
        </form>
        <p id="announcementMessage" class="form-message" aria-live="polite"></p>
      </div>

      <div class="admin-card">
        <h2>Recent Announcements</h2>
        <div id="adminAnnouncementList">
          <p class="muted">Loading...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
